<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attention Redirector</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <p class="kicker">Attention Redirector</p>
          <h1>Make the web quieter.</h1>
        </div>
        <input id="globalToggle" type="checkbox" role="switch" aria-label="Enable extension">
      </header>

      <section class="site-row" aria-label="Current site">
        <span>
          <strong>This site</strong>
          <small id="siteLabel">Current domain</small>
        </span>
        <input id="siteToggle" type="checkbox" role="switch" aria-label="Enable on this site">
      </section>

      <section class="control-section">
        <div id="anchorField" class="anchor-field">
          <div class="anchor-field__header">
            <label for="anchorNote">Notes</label>
            <button
              id="addAnchorMessage"
              class="anchor-field__add"
              type="button"
              aria-label="Add another note"
              title="Add another note"
            >+</button>
          </div>
          <div id="anchorNotes" class="anchor-notes"></div>
          <small id="anchorCount">1/5 local notes</small>
        </div>
      </section>

      <div class="primary-actions">
        <button id="reportMissedAd" type="button" class="primary-button">Report missed ad</button>
        <button id="openOptions" type="button" class="secondary-button">Options</button>
      </div>

      <details class="advanced">
        <summary>Advanced</summary>
        <div class="advanced-actions">
          <button id="replaceNow" type="button" class="text-button">Scan again</button>
          <button id="inspectClutter" type="button" class="text-button">Diagnostic inspector</button>
        </div>
      </details>

      <p id="statusText" class="status-text">Checking page status...</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
