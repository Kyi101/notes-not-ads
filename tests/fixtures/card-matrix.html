<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes Not Ads Card Matrix</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f7f7f4;
        color: #202624;
        font-family: Georgia, serif;
      }

      .matrix-caption {
        margin: 0 0 8px;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        font-weight: 400;
        color: #66736f;
      }

      .ad-slot {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        margin: 0 0 40px;
        border: 1px dashed #b67b2b;
        background: #fff2d9;
        font-size: 13px;
        color: #7a5a22;
      }

      /* The replacer removes the slot's inline visibility, so an inline
         visibility: hidden is not a real test of a hidden host container. A
         stylesheet rule is what a site actually writes for a slot it hides. */
      .host-stylesheet-hidden {
        visibility: hidden;
      }

      /* Host CSS reaches the card on two axes, and HOSTILE_SLOT_CSS below only
         covers one: properties that inherit down from the slot. The rules here
         are the other axis, the one that produced both Forbes bugs — a rule
         written for the ad container's inner divs matches our card directly,
         because once it is appended into the slot it is one of those divs. They
         have to be stylesheet rules; an inline style cannot address a
         descendant, which is exactly why this axis was missing.

         Each pair is deliberate about !important. Where the site declaration is
         ordinary, our one-class !important rule in content.css wins whatever
         the specificity. Where it is important at (0,1,1) it beats every rule
         in content.css, and only the inline pins in buildCard survive it. Both
         cases are here because they fail in different places. */
      .host-descendant-caption div::before {
        content: "Advertisement";
        position: absolute;
        left: 50%;
        margin-top: -20px;
        text-transform: uppercase;
        transform: translate(-50%);
      }

      .host-descendant-captured div {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        inset: 0 !important;
      }

      /* -webkit-box is what carries the line clamp, so blockifying the body
         drops it: the note runs past the card instead of ending in an ellipsis. */
      .host-descendant-blockified div {
        display: block !important;
      }

      .host-descendant-ghosted div {
        color: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      // The size and hostility lists live here so the fixture is the single
      // source of truth; the audit script reads labels back off the DOM.
      const SLOT_SIZES = [
        ["mobile-banner", 320, 50],
        ["banner", 468, 60],
        ["leaderboard", 728, 90],
        ["billboard", 970, 250],
        ["mrec", 300, 250],
        ["large-rect", 336, 280],
        ["square", 250, 250],
        ["halfpage", 300, 600],
        ["skyscraper", 160, 600],
        ["inline-wide-short", 540, 230],
        ["full-width-strip", 1583, 319],
        // Measured off NY Post's sticky rail, which is taller than the viewport.
        // Every other shape here fits on screen, so nothing in the matrix could
        // show what a note looks like adrift in a box that does not.
        ["sticky-rail", 300, 1250]
      ];

      // Text styling a host page can put on its own ad container. Every one of
      // these inherits or propagates into the card, which lives inside that
      // container, so the card gets them whether or not it asked. All are
      // ordinary CSS that real sites write for their own ad captions.
      const HOSTILE_SLOT_CSS = [
        ["nowrap", "white-space: nowrap;"],
        ["vertical-text", "writing-mode: vertical-rl;"],
        ["uppercase", "text-transform: uppercase;"],
        ["indented", "text-indent: 64px;"],
        ["tracked-out", "letter-spacing: 6px;"],
        ["underlined", "text-decoration: underline;"],
        ["transparent-fill", "-webkit-text-fill-color: transparent;"],
        ["tiny-text", "font-size: 4px;"]
      ];

      // Applied through the stylesheet rather than inline, because inline styles
      // on the slot are the ones the replacer clears. A slot the site keeps
      // hidden is meant to stay empty, so "no card" is the passing result.
      const HOSTILE_SLOT_CLASSES = [
        ["stylesheet-hidden", "host-stylesheet-hidden", "no-card"]
      ];

      // The other axis: rules that match the card element itself. The probe is
      // read off a control div left inside the slot, which the rule matches and
      // the card's defences do not cover. Without it a rule that quietly stopped
      // matching — a renamed class, a selector the replacer's own markup no
      // longer satisfies — would leave every one of these cells passing empty.
      const HOSTILE_DESCENDANT_CSS = [
        ["caption", "host-descendant-caption", "::before content=Advertisement"],
        ["captured", "host-descendant-captured", "position=absolute"],
        ["blockified", "host-descendant-blockified", "display=block"],
        ["ghosted", "host-descendant-ghosted", "color=rgba(0, 0, 0, 0)"]
      ];

      // Slots are direct children of body on purpose. A wrapper element that
      // contains both the caption and the slot is itself a legitimate ad
      // container, so the scanner claims the wrapper and the card stops landing
      // on the box whose size we are auditing.
      function addSlot(label, width, height, extraCss, extraClass, expect, probe) {
        const caption = document.createElement("p");
        caption.className = "matrix-caption";
        caption.textContent = `${label} — ${width}x${height}`;
        document.body.append(caption);

        const slot = document.createElement("div");
        slot.className = extraClass ? `ad-slot ${extraClass}` : "ad-slot";
        slot.id = `matrix-ad-${label}`;
        slot.dataset.adSlot = label;
        slot.dataset.matrixLabel = label;
        slot.dataset.matrixWidth = String(width);
        slot.dataset.matrixHeight = String(height);
        if (expect) {
          slot.dataset.matrixExpect = expect;
        }
        slot.style.cssText = `width:${width}px;height:${height}px;${extraCss || ""}`;
        slot.textContent = "Advertisement";

        if (probe) {
          slot.dataset.matrixProbe = probe;
          const control = document.createElement("div");
          control.className = "matrix-control";
          control.textContent = "creative";
          slot.append(control);
        }

        document.body.append(slot);
      }

      for (const [label, width, height] of SLOT_SIZES) {
        addSlot(label, width, height, "");
      }

      for (const [name, css] of HOSTILE_SLOT_CSS) {
        addSlot(`hostile-${name}`, 540, 230, css);
      }

      for (const [name, className, expect] of HOSTILE_SLOT_CLASSES) {
        addSlot(`hostile-${name}`, 540, 230, "", className, expect);
      }

      for (const [name, className, probe] of HOSTILE_DESCENDANT_CSS) {
        addSlot(`hostile-${name}`, 540, 230, "", className, "", probe);
      }
    </script>
  </body>
</html>
