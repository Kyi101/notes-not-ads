name: False positive
description: The extension replaced something that was not an ad.
title: "[false-positive] "
labels: ["false-positive", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Replacing something that was not an ad is worse than missing an ad, so
        these are read first.

        If you got here from the extension, the site and the report below are
        already filled in and the same text is on your clipboard. Two questions
        are left blank on purpose: only you can answer them.

  - type: input
    id: site
    attributes:
      label: Site
      description: Origin plus path. No query string.
      placeholder: https://example.com/news/article
    validations:
      required: true

  - type: textarea
    id: replaced
    attributes:
      label: What got replaced
      description: What was in that spot before the card appeared, and where on the
        page it sat.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How bad was it?
      options:
        - Cosmetic — the page still worked
        - Lost content I wanted to read
        - Lost a control I needed to use
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Report from the extension
      description: Filled in for you if you used "Report a wrongly replaced page"
        in the popup. Otherwise optional — it carries the page, the match reason
        and the element signature, which is most of the diagnosis.
      render: text
    validations:
      required: false
