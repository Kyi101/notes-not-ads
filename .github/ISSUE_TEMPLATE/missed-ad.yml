name: Missed ad
description: An ad survived on a page.
title: "[missed] "
labels: ["missed-ad", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Press **Report missed ad** in the extension popup, click the ad that
        survived, then press **Open a prefilled issue**. The site and report
        below arrive filled in, and the same text is on your clipboard.

        Read the report before submitting. The page address is already cut back
        to origin plus path, but the element's own text is included as-is.

  - type: input
    id: site
    attributes:
      label: Site
      description: Origin plus path. No query string.
      placeholder: https://example.com/news/article
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Inspector report
      description: Paste the whole report. Triage reads the reasons and safety blocks.
      render: text
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Does it come back on reload?
      options:
        - Every time
        - Sometimes
        - Only saw it once
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Whether you were signed in, which country you are in, whether a
        consent banner was involved. Ad delivery varies by all three.
    validations:
      required: false
